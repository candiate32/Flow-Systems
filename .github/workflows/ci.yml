name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  functions:
    name: Edge Functions (deno check, deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test -A supabase/functions

  database:
    name: Database and end to end (supabase test db, ingest-form)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,logflare,vector
      - run: npx supabase test db
      - name: Edge Function tests against the local database
        run: |
          eval "$(npx supabase status -o env | grep -E '^SERVICE_ROLE_KEY=')"
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" deno test -A supabase/functions
      - name: End to end through supabase functions serve
        run: |
          npx supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -X OPTIONS http://127.0.0.1:54321/functions/v1/ingest-form && break
            sleep 2
          done
          # Warm the worker so the timed request doesn't include a cold boot.
          curl -s -o /dev/null -X POST http://127.0.0.1:54321/functions/v1/ingest-form -H 'content-type: application/json' -d '{}' || true
          scripts/e2e-ingest.sh
      - if: failure()
        name: Show function logs
        run: |
          cat functions.log || true
          # Also surface the tail as annotations, readable from the checks API.
          tail -n 15 functions.log 2>/dev/null | while IFS= read -r line; do echo "::error title=functions serve::${line}"; done

  secrets:
    name: No server secrets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block service_role / secret keys
        run: |
          # Supabase secret keys and JWT-style keys must live only in Supabase or GitHub secrets.
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!package-lock.json'; then
            echo "::error::Possible Supabase key committed. Move it to Supabase or GitHub Actions secrets."
            exit 1
          fi
          # Vite ships every VITE_ variable to the browser.
          if git grep -niE 'VITE_[A-Z_]*(SERVICE_ROLE|SECRET)' -- apps; then
            echo "::error::A secret is exposed through a VITE_ variable."
            exit 1
          fi
