name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  functions:
    name: Edge Functions (deno check, deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test -A supabase/functions

  database:
    name: Database and end to end (supabase test db, ingest-form)
    runs-on: ubuntu-latest
    env:
      # Test-only secret for the fake WhatsApp provider's webhook signature.
      # functions serve gets it through an env file; scripts/e2e-webhook.sh signs with it.
      WHATSAPP_WEBHOOK_SECRET: ci-fake-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      # No edge runtime here: `functions serve` below starts the only one, so requests never land mid-swap.
      - run: npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime
      - run: npx supabase test db
      - name: Edge Function tests against the local database
        run: |
          eval "$(npx supabase status -o env | grep -E '^SERVICE_ROLE_KEY=')"
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" deno test -A supabase/functions
      - name: End to end through supabase functions serve
        run: |
          printf 'WHATSAPP_WEBHOOK_SECRET=%s\n' "$WHATSAPP_WEBHOOK_SECRET" > "$RUNNER_TEMP/functions.env"
          npx supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > functions.log 2>&1 &
          for i in $(seq 1 180); do grep -q "Serving functions on" functions.log && break; sleep 1; done
          grep -q "Serving functions on" functions.log || { echo "::error title=functions serve::never started"; exit 1; }
          # Then wait for a 200 from the function itself (Kong answers OPTIONS on its own).
          # A full valid enquiry also warms the worker and its database client, so the timed request is warm.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/ingest-form \
              -H 'content-type: application/json' \
              -d '{"source_key":"demo-web-form","name":"Warm Up","phone":"9000000099","consent":true}' || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { echo "::error title=functions serve::ingest-form never returned 200 (last $code)"; exit 1; }
          scripts/e2e-ingest.sh
      # Spec 004, A.7: 100 concurrent enquiries against the same functions serve.
      - name: Burst of 100 enquiries
        run: scripts/burst.sh
      # Spec 004, C: signed fake webhooks through the same functions serve.
      - name: WhatsApp webhook end to end
        run: scripts/e2e-webhook.sh
      - if: failure()
        name: Show function logs
        run: |
          cat functions.log || true
          # Also surface the tail as annotations, readable from the checks API.
          tail -n 15 functions.log 2>/dev/null | while IFS= read -r line; do echo "::error title=functions serve::${line}"; done

  secrets:
    name: No server secrets in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block service_role / secret keys
        run: |
          # Supabase secret keys and JWT-style keys must live only in Supabase or GitHub secrets.
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!package-lock.json'; then
            echo "::error::Possible Supabase key committed. Move it to Supabase or GitHub Actions secrets."
            exit 1
          fi
          # Vite ships every VITE_ variable to the browser.
          if git grep -niE 'VITE_[A-Z_]*(SERVICE_ROLE|SECRET)' -- apps; then
            echo "::error::A secret is exposed through a VITE_ variable."
            exit 1
          fi
